<div class="login-container">
  <div class="login-card">
    <h2>🌱 Crear Cuenta Nueva</h2>
    
    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" [(ngModel)]="usuario" name="usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required>
      </div>

      <button type="submit" class="btn-primary" [disabled]="!usuario || !password">
        Registrarse
      </button>

      <p class="register-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Iniciar Sesión</a>
      </p>

      <!-- MENSAJE CON ANIMACIÓN -->
      <div *ngIf="message" 
           class="message-box"
           [class.success]="isSuccess"
           [class.error]="isError"
           [class.fade-in]="message">
        <div class="message-icon">
          {{ isSuccess ? '✅' : '❌' }}
        </div>
        <div class="message-text">
          {{ message }}
        </div>
      </div>
    </form>
  </div>
</div>
