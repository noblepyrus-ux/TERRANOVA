<div class="login-container">
  <!-- Imagen de fondo completa -->
  <div class="login-background">
    <div class="background-overlay"></div>
  </div>

  <!-- Contenido dividido en dos columnas -->
  <div class="login-content">
    
    <!-- Columna izquierda: Branding -->
    <div class="brand-column">
      <div class="brand-content">
        <div class="brand-logo">🌾</div>
        <h1 class="brand-title">TERRANOVA</h1>
        <div class="brand-subtitle">
          <span class="subtitle-line big">Sistema de</span>
          <span class="subtitle-line big">gestión agricola</span>
        </div>
        <div class="brand-tagline">
          <span class="subtitle-line">Únete y comienza a</span>
          <span class="subtitle-line">gestionar tu operación</span>
          <span class="subtitle-line">agrícola de forma inteligente</span>
        </div>
      </div>
    </div>

    <!-- Columna derecha: Formulario -->
    <div class="form-column">
      <div class="form-wrapper">
        <div class="form-header">
          <div class="logo-small">🌾</div>
          <h2>Crear Cuenta</h2>
          <p>Comienza tu viaje con Terranova</p>
          <div class="header-divider"></div>
        </div>

        <div *ngIf="errorMessage" class="message-box error">
          <span class="message-icon">❌</span>
          <span class="message-text">{{ errorMessage }}</span>
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="usuario">Usuario</label>
            <div class="input-wrapper">
              <span class="input-icon"></span>
              <input 
                type="text" 
                id="usuario" 
                [(ngModel)]="usuario" 
                name="usuario" 
                required 
                placeholder="Elige un usuario">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input 
                type="password" 
                id="password" 
                [(ngModel)]="password" 
                name="password" 
                required 
                placeholder="Elige una contraseña">
            </div>
          </div>

          <button type="submit" class="btn-primary" [disabled]="!usuario || !password">
            Crear Cuenta <span class="btn-arrow">→</span>
          </button>
        </form>

        <div class="form-footer">
          <div class="footer-divider">
            <span>o</span>
          </div>
          <p>¿Ya tienes cuenta? <a (click)="router.navigate(['/login'])" style="cursor: pointer;">Iniciar sesión</a></p>
        </div>
      </div>
    </div>

  </div>
</div>
