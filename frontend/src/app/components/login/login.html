<div class="login-container">
  <div class="login-card">
    <h2>🌾 Terranova - Iniciar Sesión</h2>
    
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" [(ngModel)]="usuario" name="usuario" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required>
      </div>

      <button type="submit" class="btn-primary" [disabled]="!usuario || !password">
        Ingresar
      </button>

      <p class="register-link">
        ¿No tienes cuenta? <a routerLink="/register">Crear cuenta</a>
      </p>

      <!-- MENSAJE CON ANIMACIÓN -->
      <div *ngIf="errorMessage" 
           class="message-box error"
           [class.fade-in]="errorMessage">
        <div class="message-icon">
          ❌
        </div>
        <div class="message-text">
          {{ errorMessage }}
        </div>
      </div>
    </form>
  </div>
</div>
